[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextcue-hardware"
version = "0.1.0"
description = "ContextCue UNO Q hardware gateway and sensor bring-up"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
board = ["arduino-router-bridge==0.5.1"]

[project.scripts]
contextcue-hardware = "contextcue.cli:main"

[tool.setuptools.packages.find]
where = ["apps/contextcue_hardware/python"]
include = ["contextcue*"]

[tool.pytest.ini_options]
pythonpath = ["apps/contextcue_hardware/python"]
testpaths = ["tests"]
