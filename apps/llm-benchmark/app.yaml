name: ContextCue LLM Benchmark
icon: ⏱️
description: G1 feasibility benchmark for on-board ContextCue briefings with Arduino's local LLM Brick.

bricks:
  - arduino:llm:
      model: llamacpp:Qwen3.5-0.8B-Q4_0
      variables:
        # Requests are capped at 2048 input + 160 output tokens (baseline §6).
        LLAMA_ARG_CTX_SIZE: "4096"
        # The prompt cache defaults to 8192 MiB, above the container's 2.5 GB
        # limit; on 7 November it grew until the server thrashed and was
        # OOM-killed. Disable it and use one slot (requests are sequential).
        LLAMA_ARG_CACHE_RAM: "0"
        LLAMA_ARG_N_PARALLEL: "1"
