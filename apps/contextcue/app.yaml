name: ContextCue
description: ContextCue desk companion on the UNO Q - application, kiosk UI, real Modulino sensors and the on-board LLM. Assembled by scripts/contextcue-app.sh.

bricks:
  # On-board llama.cpp model server (CPU), reached at
  # http://llamacpp-models-runner:9999/v1 from the app container.
  - arduino:llm:
      model: llamacpp:Qwen3.5-0.8B-Q4_0
      variables:
        # Requests stay well under 1024 tokens (compact snapshots, <=100 out).
        LLAMA_ARG_CTX_SIZE: "4096"
        # The prompt cache defaults to 8192 MiB, above the container's 2.5 GB
        # limit; the G1 benchmark was OOM-killed with it. One slot: requests
        # are sequential (one active request at a time).
        LLAMA_ARG_CACHE_RAM: "0"
        LLAMA_ARG_N_PARALLEL: "1"
